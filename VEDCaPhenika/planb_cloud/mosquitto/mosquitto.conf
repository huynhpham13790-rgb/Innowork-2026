listener 1883
persistence true
persistence_location /mosquitto/data/

# Bắt buộc đăng nhập. Tạo file passwd bằng lệnh trong PLAN_B_CLOUD.md TRƯỚC khi chạy.
# Thiếu file passwd -> container mosquitto crash-loop, ESP32 chỉ báo rc=-2.
# Cú pháp này đúng cho mosquitto 2.0.x (đã ghim trong docker-compose.yml).
allow_anonymous false
password_file /mosquitto/config/passwd

# Nếu chỉ chạy thử trong mạng LAN nhà mình và chưa muốn tạo passwd,
# comment 2 dòng trên rồi bỏ comment dòng dưới:
# allow_anonymous true
